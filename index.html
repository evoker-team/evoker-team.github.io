<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — EVOKER TEAM</title>
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ——— Базовые стили (полностью скопированы из основного сайта) ——— */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --black: #07060b;
            --dark: #0c0a14;
            --dark-purple: #1a0b2e;
            --purple: #7b2fbe;
            --bright-purple: #a855f7;
            --light-purple: #c084fc;
            --glow-purple: rgba(168, 85, 247, 0.5);
            --white: #f0ecf9;
            --gray: #b8b0cc;
            --minecraft-font: 'Press Start 2P', 'Courier New', monospace;
            --body-font: 'Inter', 'Segoe UI', sans-serif;
            --glass-bg: rgba(12, 10, 20, 0.6);
            --glass-border: rgba(168, 85, 247, 0.2);
            --transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--bright-purple) var(--black);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--black);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bright-purple);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--glow-purple);
        }
        body {
            font-family: var(--body-font);
            background: var(--black);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            cursor: none;
        }
        .cursor-glow {
            position: fixed;
            left: 0;
            top: 0;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
            will-change: left, top;
        }
        .cursor-dot {
            position: fixed;
            left: 0;
            top: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bright-purple);
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--glow-purple), 0 0 60px rgba(168, 85, 247, 0.2);
            transition: width 0.2s, height 0.2s, background 0.2s;
            will-change: left, top;
        }
        .cursor-dot.hover {
            width: 16px;
            height: 16px;
            background: var(--light-purple);
            box-shadow: 0 0 40px var(--glow-purple), 0 0 80px rgba(168, 85, 247, 0.3);
        }
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.06;
            animation: floatShape 20s infinite ease-in-out alternate;
        }
        .floating-shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: var(--bright-purple);
            top: -5%;
            left: -5%;
            animation-duration: 25s;
        }
        .floating-shape:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #ec4899;
            bottom: -10%;
            right: -10%;
            animation-duration: 30s;
            animation-delay: -5s;
            border-radius: 40% 60% 50% 50%;
        }
        .floating-shape:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #8b5cf6;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 22s;
            animation-delay: -10s;
            border-radius: 30% 70% 60% 40%;
        }
        .floating-shape:nth-child(4) {
            width: 150px;
            height: 150px;
            background: #06b6d4;
            top: 20%;
            right: 10%;
            animation-duration: 18s;
            animation-delay: -3s;
            border-radius: 60% 40% 70% 30%;
        }
        .floating-shape:nth-child(5) {
            width: 250px;
            height: 250px;
            background: #f59e0b;
            bottom: 20%;
            left: 10%;
            animation-duration: 28s;
            animation-delay: -8s;
            border-radius: 50% 50% 40% 60%;
        }
        @keyframes floatShape {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(30px, -40px) scale(1.1) rotate(15deg);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.9) rotate(-10deg);
            }
            100% {
                transform: translate(15px, -15px) scale(1.05) rotate(5deg);
            }
        }
        .site-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }
        /* ——— Шапка (как на основном сайте) ——— */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 14px 0;
            background: rgba(7, 6, 11, 0.7);
            backdrop-filter: blur(20px) saturate(1.2);
            border-bottom: 1px solid rgba(168, 85, 247, 0.08);
            transition: var(--transition);
        }
        .header.scrolled {
            background: rgba(7, 6, 11, 0.92);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            border-bottom-color: rgba(168, 85, 247, 0.15);
        }
        .header .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--white);
            font-family: var(--minecraft-font);
            font-size: 1.05rem;
            letter-spacing: 2px;
            transition: var(--transition);
            position: relative;
        }
        .logo .logo-icon {
            font-size: 1.6rem;
            color: var(--bright-purple);
            filter: drop-shadow(0 0 20px var(--glow-purple));
            animation: pulseIcon 3s ease-in-out infinite;
        }
        @keyframes pulseIcon {
            0%,
            100% {
                filter: drop-shadow(0 0 20px var(--glow-purple));
            }
            50% {
                filter: drop-shadow(0 0 40px var(--glow-purple)) drop-shadow(0 0 80px rgba(168, 85, 247, 0.15));
            }
        }
        .logo:hover {
            color: var(--bright-purple);
            transform: scale(1.03);
        }
        .logo span {
            background: linear-gradient(135deg, var(--bright-purple), #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }
        .nav-links a {
            color: var(--gray);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            transition: var(--transition);
            position: relative;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a i {
            font-size: 0.75rem;
            opacity: 0.6;
            transition: var(--transition);
        }
        .nav-links a:hover i {
            opacity: 1;
            color: var(--bright-purple);
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--bright-purple), var(--light-purple));
            transition: var(--transition);
            box-shadow: 0 0 20px var(--glow-purple);
        }
        .nav-links a:hover {
            color: var(--white);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .burger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
            background: transparent;
            border: none;
            z-index: 1001;
        }
        .burger span {
            display: block;
            width: 28px;
            height: 2.5px;
            background: var(--white);
            border-radius: 3px;
            transition: var(--transition);
            transform-origin: center;
        }
        .burger.active span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }
        .burger.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .burger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }
        /* ——— Герой-404 ——— */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 20px 80px;
            overflow: hidden;
            z-index: 1;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/photo.png');
            background-size: 40% auto;
            background-position: 50% 50%;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 0.2;
            filter: brightness(0.5) saturate(1.2) blur(2px);
            mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 70%);
        }
        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(123, 47, 190, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(12, 10, 20, 0.6) 0%, transparent 40%);
            z-index: 0;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-family: var(--minecraft-font);
            color: var(--light-purple);
            letter-spacing: 2px;
            margin-bottom: 32px;
            animation: fadeInDown 0.8s ease forwards;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.05);
        }
        .hero-badge .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f87171;
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.5);
            animation: pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }
        .hero h1 {
            font-family: var(--minecraft-font);
            font-size: clamp(6rem, 18vw, 12rem);
            line-height: 1.05;
            margin-bottom: 10px;
            animation: fadeInUp 1s ease forwards;
            background: linear-gradient(135deg, var(--bright-purple), #d8b4fe, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 60px rgba(168, 85, 247, 0.3));
            text-shadow: 0 0 80px rgba(168, 85, 247, 0.15);
        }
        .hero h2 {
            font-family: var(--minecraft-font);
            font-size: clamp(1.5rem, 4vw, 2.6rem);
            color: var(--white);
            margin-bottom: 16px;
            animation: fadeInUp 1.2s ease forwards;
            opacity: 0;
            animation-delay: 0.15s;
        }
        .hero p {
            font-size: 1.2rem;
            color: var(--gray);
            max-width: 560px;
            margin: 0 auto 40px;
            font-weight: 400;
            animation: fadeInUp 1.4s ease forwards;
            opacity: 0;
            animation-delay: 0.3s;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            line-height: 1.8;
        }
        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            animation: fadeInUp 1.6s ease forwards;
            opacity: 0;
            animation-delay: 0.45s;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: var(--body-font);
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--purple), var(--bright-purple));
            color: #fff;
            box-shadow: 0 0 40px var(--glow-purple);
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            animation: shimmer 6s infinite linear;
        }
        @keyframes shimmer {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .btn-primary:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 0 60px var(--glow-purple), 0 0 120px rgba(168, 85, 247, 0.15);
        }
        .btn-secondary {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--white);
        }
        .btn-secondary:hover {
            background: rgba(168, 85, 247, 0.12);
            border-color: var(--bright-purple);
            transform: translateY(-4px);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.05);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .footer {
            padding: 40px 0 28px;
            border-top: 1px solid var(--glass-border);
            text-align: center;
            color: var(--gray);
            font-size: 0.85rem;
            position: relative;
            z-index: 1;
            background: var(--black);
        }
        .footer .minecraft-brand {
            font-family: var(--minecraft-font);
            font-size: 0.7rem;
            color: var(--light-purple);
            letter-spacing: 2px;
        }
        .footer .minecraft-brand i {
            color: var(--bright-purple);
            margin: 0 6px;
        }
        .footer .footer-divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--bright-purple), transparent);
            margin: 14px auto;
        }
        /* ——— Адаптив ——— */
        @media (max-width: 1024px) {
            .hero::before {
                background-size: 50% auto;
                background-position: 45% 45%;
            }
        }
        @media (max-width: 768px) {
            .cursor-glow,
            .cursor-dot {
                display: none !important;
            }
            body {
                cursor: auto;
            }
            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 290px;
                height: 100vh;
                background: rgba(7, 6, 11, 0.97);
                backdrop-filter: blur(30px);
                flex-direction: column;
                justify-content: center;
                padding: 40px 32px;
                gap: 24px;
                transition: var(--transition);
                border-left: 1px solid var(--glass-border);
            }
            .nav-links.open {
                right: 0;
            }
            .nav-links a {
                font-size: 1rem;
            }
            .burger {
                display: flex;
            }
            .hero::before {
                background-size: 65% auto;
                background-position: 40% 40%;
                opacity: 0.15;
            }
            .hero h1 {
                font-size: clamp(4rem, 15vw, 6rem);
            }
            .hero h2 {
                font-size: 1.6rem;
            }
            .hero p {
                font-size: 1rem;
            }
            .btn {
                padding: 12px 24px;
                font-size: 0.75rem;
            }
            .floating-shapes {
                display: none;
            }
        }
        @media (max-width: 480px) {
            .hero::before {
                background-size: 80% auto;
                background-position: 35% 40%;
                opacity: 0.1;
            }
            .hero h1 {
                font-size: 3.2rem;
            }
            .hero h2 {
                font-size: 1.2rem;
            }
            .hero p {
                font-size: 0.9rem;
            }
            .hero-badge {
                font-size: 0.5rem;
                padding: 6px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Курсор -->
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-dot" id="cursorDot"></div>

    <!-- Фоновый канвас -->
    <canvas id="bg-canvas"></canvas>

    <!-- Плавающие фигуры -->
    <div class="floating-shapes">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <!-- Шапка -->
    <header class="header" id="header">
        <div class="container">
            <a href="/" class="logo">
                <i class="fas fa-dragon logo-icon"></i> EVOKER<span>TEAM</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="/"><i class="fas fa-home"></i> Главная</a></li>
                <li><a href="/#about"><i class="fas fa-info-circle"></i> О нас</a></li>
                <li><a href="/#members"><i class="fas fa-users"></i> Участники</a></li>
                <li><a href="/#gallery"><i class="fas fa-images"></i> Галерея</a></li>
            </ul>
            <button class="burger" id="burger" aria-label="Меню">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <!-- Герой-404 -->
    <section class="hero" id="home">
        <div class="hero-content">
            <div class="hero-badge"><span class="pulse-dot"></span> Ошибка 404</div>
            <h1>404</h1>
            <h2>Страница не найдена</h2>
            <p>Похоже, вы попали в тёмные уголки нашего мира. Но не волнуйтесь — мы поможем вам вернуться на свет.</p>
            <div class="hero-buttons">
                <a href="/" class="btn btn-primary"><i class="fas fa-arrow-left"></i> На главную</a>
                <a href="/#join" class="btn btn-secondary"><i class="fas fa-users"></i> Присоединиться</a>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="footer">
        <div class="site-wrapper">
            <div class="minecraft-brand"><i class="fas fa-cube"></i> EVOKER TEAM <i class="fas fa-cube"></i></div>
            <div class="footer-divider"></div>
            <p style="margin-top: 14px; font-size: 0.75rem; opacity: 0.6;">&copy; 2026 EVOKER TEAM — Minecraft Clan</p>
        </div>
    </footer>

    <script>
        // ——— Курсор (как на основном сайте) ———
        const cursorDot = document.getElementById('cursorDot');
        const cursorGlow = document.getElementById('cursorGlow');
        let mouseX = -200,
            mouseY = -200;
        let dotX = -200,
            dotY = -200;
        let glowX = -200,
            glowY = -200;
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX;
            mouseY = e.clientY; });
        document.addEventListener('mouseleave', () => { mouseX = -200;
            mouseY = -200; });
        document.querySelectorAll('a, button, .btn, .logo').forEach(el => {
            el.addEventListener('mouseenter', () => cursorDot.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursorDot.classList.remove('hover'));
        });

        function animateCursor() {
            dotX += (mouseX - dotX) * 0.15;
            dotY += (mouseY - dotY) * 0.15;
            glowX += (mouseX - glowX) * 0.04;
            glowY += (mouseY - glowY) * 0.04;
            cursorDot.style.left = dotX + 'px';
            cursorDot.style.top = dotY + 'px';
            cursorGlow.style.left = glowX + 'px';
            cursorGlow.style.top = glowY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // ——— Фоновый канвас (такой же как на основном сайте) ———
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgW, bgH;

        function resizeBg() { bgW = bgCanvas.width = window.innerWidth;
            bgH = bgCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeBg);
        resizeBg();
        const spots = [];
        const SPOT_COUNT = 6;
        class Spot {
            constructor() {
                this.x = Math.random() * bgW;
                this.y = Math.random() * bgH;
                this.radius = Math.random() * 300 + 150;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.color = `hsla(${260 + Math.random() * 40}, ${70 + Math.random() * 20}%, ${50 + Math.random() * 20}%, ${0.03 + Math.random() * 0.04})`;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < -this.radius || this.x > bgW + this.radius) this.vx *= -1;
                if (this.y < -this.radius || this.y > bgH + this.radius) this.vy *= -1;
            }
            draw() {
                const grad = bgCtx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                grad.addColorStop(0, this.color);
                grad.addColorStop(1, 'transparent');
                bgCtx.fillStyle = grad;
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                bgCtx.fill();
            }
        }
        for (let i = 0; i < SPOT_COUNT; i++) spots.push(new Spot());

        function animateBg() {
            bgCtx.clearRect(0, 0, bgW, bgH);
            spots.forEach(s => { s.update();
                s.draw(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // ——— Бургер-меню ———
        const burger = document.getElementById('burger');
        const navLinks = document.getElementById('navLinks');
        burger.addEventListener('click', () => {
            burger.classList.toggle('active');
            navLinks.classList.toggle('open');
        });
        document.querySelectorAll('.nav-links a').forEach(link => link.addEventListener('click', () => {
            burger.classList.remove('active');
            navLinks.classList.remove('open');
        }));

        // ——— Скролл шапки ———
        const header = document.getElementById('header');
        window.addEventListener('scroll', () => {
            header.classList.toggle('scrolled', window.scrollY > 60);
        });
    </script>
</body>
</html>
